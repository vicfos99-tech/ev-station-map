<!-- 누른 지점 거리(A8): 지도를 누르면 ui_map 이 이 상자를 누른 자리의 지도 풍선에 꽂는다(그 전·사라진 뒤에는 숨김). 상자 전체가 닫기 단추. 글은 ui_tap.js 가 설정(config_tap.ui)에서 넣는다 -->
