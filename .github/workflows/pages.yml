# 웹 앱(web/)을 한 파일로 합쳐 GitHub Pages 에 올린다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 해 둬야 한다(처음 한 번).
name: pages

on:
  push:
    branches: [master]
  # 집 PC 중계가 relay-data 브랜치에 10분마다 올린 자료를 relay/ 로 내려고 10분마다 다시 만든다(2026-11-17).
  # relay-data 로의 push 는 이 파일을 부르지 못하고, github-pages 환경은 master 만 배포할 수 있어서 시각으로 돈다.
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 한 파일로 합치기
        run: node web/build.js
      - name: 올릴 폴더 만들기 (index.html 만)
        run: |
          mkdir -p _site
          cp web/dist/index.html _site/index.html
      - name: 중계 자료(relay-data 브랜치)를 relay/ 로 넣기
        run: |
          mkdir -p _site/relay
          if git fetch --depth 1 origin relay-data; then
            git archive FETCH_HEAD | tar -x -C _site/relay
          else
            echo "relay-data 브랜치가 아직 없음 — relay/ 없이 올림"
          fi
      # 새 앱(web2)을 '고정 파일 판'으로 지어 _site/web2/ 에 더한다(6-2). 위의 옛 앱 단계·relay/ 는 그대로.
      # 이 판은 다리·앱 비밀 값 없이 같은 사이트의 ../relay/ 자료를 읽는다(web2/variants/static.patch.json).
      - name: 새 앱(web2) 고정 파일 판 지어 web2/ 에 넣기
        run: node web2/tools/build.mjs --out _site/web2 --patch web2/variants/static.patch.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
