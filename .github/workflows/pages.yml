# 웹 앱(web/)을 한 파일로 합쳐 GitHub Pages 에 올린다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 해 둬야 한다(처음 한 번).
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 한 파일로 합치기
        run: node web/build.js
      - name: 올릴 폴더 만들기 (index.html 만)
        run: |
          mkdir -p _site
          cp web/dist/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
