# 깃허브에 올릴 때마다 자동으로 도는 검사
# 1) 테스트 파일이 잠금과 같은지  2) 테스트가 전부 통과하는지
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: 테스트 잠금 확인
        run: python tools/check_tests_lock.py .
      - name: 테스트 실행
        run: python -m pytest -q
      # 자바스크립트 판 엔진이 파이썬 엔진과 같은 답을 내는지
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 파이썬 기대값 생성
        run: python tools/dump_fixtures.py
      - name: JS 엔진 대조
        run: node web/test/compare.js
